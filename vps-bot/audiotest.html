<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת קול</title>
<!--
  דף בדיקה זמני. מנגן נתיב /vh/ (HLS עם אודיו מומר ל-AAC) עם **אותו
  נגן שהאתר עצמו משתמש בו** — shaka-player מ-/zovex/vendor/.
//
  הגרסה הקודמת משכה hls.js מ-jsdelivr והוא לא נטען ברשת של דוד, אז הדף
  נפל אחורה לנגן המובנה של הדפדפן וקיבל DEMUXER_ERROR_COULD_NOT_PARSE.
  זה בדיוק הכשל שהקוד של האתר כבר מתעד ומונע:

      "video.js ו-shaka-player מוגשים כקבצים סטטיים מהאתר שלנו עצמו
       ולא מ-CDN חיצוני - כי אם ה-CDN חסום ברשת של המשתמש, הנגן היה
       נתקע על 'טוען...' לנצח בלי שום הודעת שגיאה"

  קיים כדי לענות על שאלה אחת: האם יוצא קול **בדפדפן**. בדיקה ב-VLC
  אינה קבילה — יש לו מפענח Dolby משלו, והוא ניגן את ונסדיי כל הזמן.

  מקבל רק נתיב יחסי שמתחיל ב-/vh/, לא כתובת מלאה.
  למחוק אחרי הבדיקה:  rm /opt/zovex-site/audiotest.html
-->
<style>
  body{background:#0f1420;color:#e8edf7;font:15px/1.6 system-ui,sans-serif;
       margin:0;padding:16px}
  video{width:100%;max-width:900px;background:#000;border-radius:10px}
  #log{margin-top:14px;padding:12px;background:#151d2e;border-radius:8px;
       white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace}
  .ok{color:#4ade80}.bad{color:#f87171}.hint{opacity:.75}
  h1{font-size:17px;margin:0 0 12px}
</style>
<h1>בדיקת קול — ‏HLS עם אודיו מומר</h1>
<video id="v" controls playsinline></video>
<div id="log"></div>
<script>
const log = (m, c) => {
  const d = document.createElement("div");
  if (c) d.className = c;
  d.textContent = m;
  document.getElementById("log").appendChild(d);
};

const raw = new URLSearchParams(location.search).get("u") || "";
const src = /^\/vh\/[^?#]*\.m3u8(\?.*)?$/.test(raw) && !raw.startsWith("//")
          ? raw : "";
const v = document.getElementById("v");

// אותו קובץ שהאתר טוען, מהשרת שלנו. אין CDN חיצוני בשום שלב.
const VENDOR = "/zovex/vendor/shaka-player.compiled.js";

function loadScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    const t = setTimeout(() => rej(new Error("timeout")), 8000);
    s.src = url;
    s.onload = () => { clearTimeout(t); res(); };
    s.onerror = () => { clearTimeout(t); rej(new Error("load failed")); };
    document.head.appendChild(s);
  });
}

(async () => {
  if (!src) { log("חסר ?u= עם נתיב /vh/…/index.m3u8", "bad"); return; }
  log("טוען את shaka-player מהשרת שלנו…");
  try {
    await loadScript(VENDOR);
  } catch (e) {
    log(`✗ shaka לא נטען מ-${VENDOR} — ${e.message}`, "bad");
    log("כלומר הקובץ לא נפרס לאתר. זו בעיה נפרדת מהקול.", "hint");
    return;
  }
  if (!window.shaka) { log("✗ הקובץ נטען אבל shaka לא הוגדר", "bad"); return; }
  log(`✓ shaka ${shaka.Player.version} נטען`, "ok");

  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) {
    log("✗ הדפדפן לא נתמך ע\"י shaka", "bad");
    return;
  }
  const player = new shaka.Player(v);
  player.addEventListener("error", e =>
    log(`שגיאת shaka: code ${e.detail.code} — ${e.detail.message || ""}`, "bad"));
  try {
    await player.load(src);
    log("✓ הפלייליסט נטען. לחץ נגן והקשב.", "ok");
  } catch (e) {
    log(`✗ טעינה נכשלה: code ${e.code} ${e.message || ""}`, "bad");
  }
})();

// זו התשובה שאנחנו מחפשים: כמה אודיו הדפדפן באמת פענח.
// עם ec-3 המספר נשאר 0 — כרום זורק את הרצועה בשקט, בלי שום שגיאה.
v.addEventListener("playing", () => {
  log(`מנגן · אורך ${Math.round(v.duration)} שניות`);
  setTimeout(() => {
    const b = v.webkitAudioDecodedByteCount;
    if (b === undefined) {
      log("הדפדפן לא מדווח על פענוח אודיו — תסמוך על האוזניים", "hint");
      return;
    }
    log(b > 0 ? `✓ פוענחו ${b.toLocaleString()} בייט אודיו — יש קול`
              : "✗ אפס בייט אודיו — הרצועה נזרקה", b > 0 ? "ok" : "bad");
  }, 3000);
});
v.addEventListener("error", () =>
  log("שגיאת וידאו: " + (v.error && v.error.message), "bad"));
</script>
</html>
