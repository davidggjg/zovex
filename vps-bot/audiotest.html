<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת קול</title>
<!--
  דף בדיקה זמני. מנגן נתיב /vh/ (HLS עם אודיו מומר ל-AAC) בדיוק כמו
  שהנגן של האתר יעשה — עם hls.js, כי כרום לא מנגן m3u8 בעצמו.

  קיים אך ורק כדי לענות על שאלה אחת: האם יוצא קול **בדפדפן**. בדיקה
  ב-VLC אינה קבילה — יש לו מפענח Dolby משלו, והוא ניגן את ונסדיי כל
  הזמן גם לפני התיקון.

  מקבל את הכתובת מ-?u=, ומקבל **רק נתיב יחסי** שמתחיל ב-/vh/ — לא
  כתובת מלאה, כדי שהדף לא יהפוך לנגן של כל דבר ברשת.

  למחוק אחרי הבדיקה:  rm /opt/zovex-site/audiotest.html
-->
<style>
  body{background:#0f1420;color:#e8edf7;font:15px/1.6 system-ui,sans-serif;
       margin:0;padding:16px}
  video{width:100%;max-width:900px;background:#000;border-radius:10px}
  #log{margin-top:14px;padding:12px;background:#151d2e;border-radius:8px;
       white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace}
  .ok{color:#4ade80}.bad{color:#f87171}.hint{opacity:.75}
  h1{font-size:17px;margin:0 0 12px}
</style>
<h1>בדיקת קול — ‏HLS עם אודיו מומר</h1>
<video id="v" controls playsinline></video>
<div id="log">טוען…</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const log = (m, c) => {
  const d = document.createElement("div");
  if (c) d.className = c;
  d.textContent = m;
  document.getElementById("log").appendChild(d);
};
document.getElementById("log").textContent = "";

const raw = new URLSearchParams(location.search).get("u") || "";
// רק נתיב יחסי משלנו. "//host" נפסל גם הוא — הוא כתובת מלאה בתחפושת.
const src = /^\/vh\/[^?#]*\.m3u8(\?.*)?$/.test(raw) && !raw.startsWith("//")
          ? raw : "";
const v = document.getElementById("v");

// hls.js קודם, תמיד. כרום באנדרואיד מחזיר "maybe" על ה-mime של HLS
// ובפועל לא מצליח לפרסר — נתפס בשטח כ-DEMUXER_ERROR_COULD_NOT_PARSE.
// canPlayType אינו הבטחה, ולכן הנגן המובנה הוא רק נפילה אחורה.
if (!src) {
  log("חסר ?u= עם נתיב /vh/…/index.m3u8", "bad");
} else if (window.Hls && Hls.isSupported()) {
  const hls = new Hls({ enableWorker: true });
  hls.loadSource(src);
  hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED, (_, d) =>
    log(`הפלייליסט נטען · ${d.levels.length} איכות · מוכן לנגן`, "ok"));
  hls.on(Hls.Events.ERROR, (_, d) =>
    log(`שגיאה: ${d.type} / ${d.details}${d.fatal ? " (קטלנית)" : ""}`, "bad"));
} else if (v.canPlayType("application/vnd.apple.mpegurl")) {
  v.src = src;                      // ספארי — מנגן HLS בעצמו
  log("נגן מובנה (ספארי)");
} else {
  log("hls.js לא נטען — אין חיבור ל-CDN?", "bad");
}

// זו התשובה שאנחנו מחפשים: כמה ערוצי אודיו הדפדפן באמת פענח.
// עם ec-3 המספר הוא 0 — כרום זורק את הרצועה בשקט, בלי שום שגיאה.
v.addEventListener("loadedmetadata", () => {
  const n = v.webkitAudioDecodedByteCount !== undefined ? "נתמך" : "לא ידוע";
  log(`מטא-דאטה נטענה · אורך ${Math.round(v.duration)} שניות`);
  log("לחץ נגן והקשב. אם יש קול — התיקון עובד.", "hint");
});
v.addEventListener("playing", () => {
  setTimeout(() => {
    const b = v.webkitAudioDecodedByteCount;
    if (b === undefined) { log("הדפדפן לא מדווח על פענוח אודיו — תסמוך על האוזניים", "hint"); return; }
    log(b > 0 ? `✓ הדפדפן פענח ${b.toLocaleString()} בייט אודיו — יש קול`
              : "✗ אפס בייט אודיו פוענחו — הרצועה נזרקה", b > 0 ? "ok" : "bad");
  }, 3000);
});
v.addEventListener("error", () => log("שגיאת וידאו: " + (v.error && v.error.message), "bad"));
</script>
</html>
