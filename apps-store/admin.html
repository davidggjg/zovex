<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AppMod · ניהול</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#161c28; --sub:#7a8296;
    --line:#e7ebf3; --accent:#5b6ef5; --accent2:#7c5cff; --soft:#eef0ff;
    --shadow:0 4px 16px rgba(30,40,80,.07); --shadow-lg:0 24px 60px rgba(30,40,80,.28);
    --danger:#e5484d; --danger-soft:#fdecec; --ok:#1a7f37;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:-apple-system,"Segoe UI",Rubik,Arial,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100dvh;padding-bottom:40px}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  /* ── כותרת ── */
  .top{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.85);backdrop-filter:blur(12px) saturate(1.3);
    border-bottom:1px solid var(--line);padding:14px 0}
  .top .wrap{display:flex;align-items:center;gap:11px}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;flex:0 0 auto}
  .top h1{font-size:17px;margin:0;font-weight:800;flex:1}
  .top .count{font-size:12px;color:var(--sub);font-weight:600}
  .btn{border:0;border-radius:11px;padding:10px 15px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(91,110,245,.32)}
  .btn.gray{background:#eaeef6;color:#41496a}
  .btn.dang{background:var(--danger-soft);color:var(--danger)}
  .btn.mini{padding:8px 12px;font-size:13px;border-radius:10px}
  .btn:active{transform:scale(.97)}
  /* ── כרטיס כללי ── */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px;box-shadow:var(--shadow)}
  .panel h2{font-size:14px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:7px}
  .panel .sub{font-size:12.5px;color:var(--sub);margin:0 0 12px}
  /* ── קטגוריות ── */
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:#3a3f7a;border:1px solid #e0e3ff;
    padding:8px 10px 8px 13px;border-radius:999px;font-size:13.5px;font-weight:700}
  .chip .x{width:19px;height:19px;border-radius:50%;background:#fff;border:1px solid #dcd9ff;color:#7a7fb5;
    display:grid;place-items:center;cursor:pointer;font-size:12px;line-height:1}
  .chip .pen{cursor:pointer;opacity:.55;font-size:12px}
  .chip.add{background:#fff;border:1.5px dashed #c7ccff;color:var(--accent);cursor:pointer}
  .empty-c{color:var(--sub);font-size:13px}
  /* ── חיפוש ── */
  .search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:11px 14px;margin:16px 0 4px}
  .search input{border:0;outline:0;flex:1;font-size:15px;background:transparent;color:var(--ink);font-family:inherit}
  .search svg{width:17px;height:17px;color:var(--sub);flex:0 0 auto}
  /* ── שורות אפליקציה ── */
  .list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .item{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:11px 13px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
  .item:active{transform:scale(.99)}
  @media(hover:hover){.item:hover{box-shadow:0 10px 26px rgba(30,40,80,.12)}}
  .item .th{width:52px;height:52px;border-radius:13px;object-fit:cover;background:#eceff5;flex:0 0 auto;border:1px solid var(--line)}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .sub2{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:12px;color:var(--sub)}
  .item .cat{background:var(--soft);color:#4850b8;font-weight:700;padding:2px 9px;border-radius:999px}
  .item .acts{display:flex;gap:7px;flex:0 0 auto}
  .icob{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);
    background:#fff;cursor:pointer}
  .icob.del{background:var(--danger-soft);border-color:#f6d5d6}
  .icob svg{width:18px;height:18px}
  .empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px}
  /* ── מודל עריכה ── */
  .mask{position:fixed;inset:0;z-index:60;background:rgba(20,26,40,.5);backdrop-filter:blur(3px);
    display:none;align-items:flex-end;justify-content:center}
  .mask.open{display:flex}
  .modal{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;
    border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);animation:up .28s cubic-bezier(.2,.85,.25,1)}
  @media(min-width:560px){.mask{align-items:center}.modal{border-radius:22px}}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .mhero{position:relative;height:170px;background:#e6e9f2;overflow:hidden;border-radius:22px 22px 0 0}
  .mhero .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(26px) saturate(1.2);transform:scale(1.25);opacity:.6}
  .mhero img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
  .mhero .close{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.92);border:0;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
  .mhero .close svg{width:19px;height:19px;color:var(--ink)}
  .mbody{padding:16px}
  label{display:block;font-size:12px;color:var(--sub);margin:12px 0 5px;font-weight:700}
  input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:0}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{min-height:120px;resize:vertical;line-height:1.6}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mfoot{display:flex;gap:10px;margin-top:18px}
  .mfoot .btn{flex:1;padding:14px;font-size:15px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;background:#161c28;color:#fff;
    padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;
    transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.err{background:var(--danger)}
</style>
</head>
<body>

<!-- כניסה -->
<div class="wrap" id="loginWrap" style="max-width:420px;margin-top:12dvh">
  <div class="panel">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:14px">
      <div class="logo">A</div><h2 style="font-size:17px;margin:0">ניהול AppMod</h2>
    </div>
    <label>סיסמת ניהול</label>
    <input id="pw" type="password" placeholder="סיסמה" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn pri" style="width:100%;margin-top:14px;padding:13px" onclick="doLogin()">כניסה</button>
    <div class="empty-c" id="loginMsg" style="margin-top:10px"></div>
  </div>
</div>

<!-- דשבורד -->
<div id="dash" style="display:none">
  <div class="top">
    <div class="wrap">
      <div class="logo">A</div>
      <h1>ניהול AppMod</h1>
      <span class="count" id="count"></span>
      <button class="btn gray mini" onclick="location.reload()">↻</button>
    </div>
  </div>

  <div class="wrap">
    <!-- קטגוריות -->
    <div class="panel">
      <h2>🏷️ קטגוריות</h2>
      <p class="sub">הוסף · שנה שם (✎) · מחק (✕). שינוי חל גם על האפליקציות המשויכות.</p>
      <div class="chips" id="chips"></div>
    </div>

    <!-- אפליקציות -->
    <div class="panel">
      <h2>📱 אפליקציות</h2>
      <p class="sub">אפליקציות נוספות בשליחת קובץ APK לבוט בפרטי. כאן עורכים או מוחקים.</p>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="חיפוש אפליקציה…" oninput="renderApps()">
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
</div>

<!-- מודל עריכה -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="mhero">
      <div class="bg" id="m_bg"></div>
      <img id="m_img" alt="">
      <button class="close" onclick="closeEdit()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="mbody">
      <label>שם האפליקציה</label>
      <input id="f_name" placeholder="שם האפליקציה">
      <div class="grid2">
        <div><label>קטגוריה</label><select id="f_cat"></select></div>
        <div><label>גרסה (אופציונלי)</label><input id="f_ver" placeholder="1.2.0"></div>
      </div>
      <label>תמונה — קישור אחד (כרטיס + ראש הדף)</label>
      <input id="f_img" placeholder="https://…/image.jpg" oninput="syncPreview()">
      <label>תיאור</label>
      <textarea id="f_desc" placeholder="תיאור האפליקציה…"></textarea>
      <div class="mfoot">
        <button class="btn dang" onclick="delFromEdit()">🗑️ מחק</button>
        <button class="btn pri" onclick="saveEdit()">💾 שמור</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let PW="", APPS=[], CATS=[], editIdx=-1;

/* ── כניסה / טעינה ── */
async function doLogin(){
  PW=document.getElementById("pw").value.trim();
  const m=document.getElementById("loginMsg"); m.textContent="בודק…";
  try{
    const r=await fetch("/apps/list",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:PW})});
    if(!r.ok) throw new Error("סיסמה שגויה");
    APPS=await r.json();
    CATS=await (await fetch("/apps/cats?t="+Date.now())).json(); if(!Array.isArray(CATS)) CATS=[];
    document.getElementById("loginWrap").style.display="none";
    document.getElementById("dash").style.display="";
    renderAll();
  }catch(e){ m.innerHTML='<span style="color:var(--danger)">'+e.message+'</span>'; }
}
function renderAll(){ renderChips(); renderApps(); document.getElementById("count").textContent=APPS.length+" אפליקציות"; }
function esc(s){return (s||"").replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function imgOf(a){return a.image||a.banner||a.icon||""}
function toast(t,err){const el=document.getElementById("toast");el.textContent=t;el.className="toast show"+(err?" err":"");
  clearTimeout(el._t);el._t=setTimeout(()=>el.className="toast"+(err?" err":""),1800);}

/* ── קטגוריות ── */
function renderChips(){
  const el=document.getElementById("chips");
  let h=CATS.map((c,i)=>`<span class="chip"><span class="pen" onclick="renameCat(${i})">✎</span>${esc(c)}<span class="x" onclick="delCat(${i})">✕</span></span>`).join("");
  h+=`<span class="chip add" onclick="addCat()">➕ הוסף קטגוריה</span>`;
  el.innerHTML=h;
}
async function addCat(){
  const v=(prompt("שם הקטגוריה החדשה:")||"").trim(); if(!v) return;
  if(CATS.includes(v)){ toast("קטגוריה כבר קיימת",1); return; }
  CATS.push(v); renderChips(); await saveCats(); toast("נוספה קטגוריה");
}
async function renameCat(i){
  const old=CATS[i]; const v=(prompt("שם חדש לקטגוריה:",old)||"").trim();
  if(!v||v===old) return;
  if(CATS.includes(v)){ toast("שם כבר קיים",1); return; }
  APPS.forEach(a=>{ if(a.category===old) a.category=v; });
  CATS[i]=v; renderChips(); renderApps();
  await saveCats(); await saveApps(true); toast("שם הקטגוריה עודכן");
}
async function delCat(i){
  const name=CATS[i];
  if(!confirm("למחוק את הקטגוריה «"+name+"»?\nאפליקציות בקטגוריה זו יישארו ללא קטגוריה.")) return;
  CATS.splice(i,1);
  APPS.forEach(a=>{ if(a.category===name) a.category=""; });
  renderChips(); renderApps();
  await saveCats(); await saveApps(true); toast("הקטגוריה נמחקה");
}
async function saveCats(){
  const r=await fetch("/apps/cats/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:PW,categories:CATS})});
  const d=await r.json(); if(r.ok&&Array.isArray(d.categories)) CATS=d.categories;
}

/* ── רשימת אפליקציות ── */
function renderApps(){
  const q=(document.getElementById("q").value||"").trim().toLowerCase();
  const el=document.getElementById("list");
  const rows=APPS.map((a,i)=>({a,i})).filter(({a})=>!q||(a.name||"").toLowerCase().includes(q));
  if(!APPS.length){ el.innerHTML='<div class="empty">אין אפליקציות עדיין.<br>שלח קובץ APK לבוט בפרטי והן יופיעו כאן.</div>'; return; }
  if(!rows.length){ el.innerHTML='<div class="empty">לא נמצאו תוצאות</div>'; return; }
  el.innerHTML=rows.map(({a,i})=>`
    <div class="item" onclick="openEdit(${i})">
      <img class="th" src="${esc(imgOf(a))}" alt="" onerror="this.style.visibility='hidden'">
      <div class="info">
        <div class="nm">${esc(a.name||"ללא שם")}</div>
        <div class="sub2">
          ${a.category?`<span class="cat">${esc(a.category)}</span>`:``}
          <span>${esc(a.size||"")}</span>${a.version?`<span>· ${esc(a.version)}</span>`:``}
        </div>
      </div>
      <div class="acts" onclick="event.stopPropagation()">
        <div class="icob" onclick="openEdit(${i})" title="עריכה">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6ef5" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </div>
        <div class="icob del" onclick="delApp(${i})" title="מחיקה">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        </div>
      </div>
    </div>`).join("");
}
async function delApp(i){
  if(!confirm("למחוק את «"+(APPS[i].name||"")+"» מהחנות?")) return;
  APPS.splice(i,1); renderAll(); await saveApps(); toast("האפליקציה נמחקה");
}

/* ── מודל עריכה ── */
function openEdit(i){
  editIdx=i; const a=APPS[i];
  document.getElementById("f_name").value=a.name||"";
  document.getElementById("f_ver").value=a.version||"";
  document.getElementById("f_img").value=imgOf(a);
  document.getElementById("f_desc").value=a.description||"";
  const sel=document.getElementById("f_cat");
  let opts=CATS.slice(); const cur=a.category||"";
  if(cur&&!opts.includes(cur)) opts.unshift(cur);
  sel.innerHTML=`<option value="">— ללא —</option>`+opts.map(c=>`<option value="${esc(c)}" ${c===cur?"selected":""}>${esc(c)}</option>`).join("");
  syncPreview();
  document.getElementById("mask").classList.add("open");
  document.body.style.overflow="hidden";
}
function syncPreview(){
  const src=document.getElementById("f_img").value.trim();
  document.getElementById("m_img").src=src;
  document.getElementById("m_bg").style.backgroundImage=src?`url("${src}")`:"";
}
function closeEdit(){ document.getElementById("mask").classList.remove("open"); document.body.style.overflow=""; editIdx=-1; }
async function saveEdit(){
  if(editIdx<0) return; const a=APPS[editIdx];
  a.name=document.getElementById("f_name").value.trim();
  a.category=document.getElementById("f_cat").value;
  a.version=document.getElementById("f_ver").value.trim();
  a.image=document.getElementById("f_img").value.trim();
  a.description=document.getElementById("f_desc").value;
  renderAll(); await saveApps(); closeEdit(); toast("נשמר ✓");
}
function delFromEdit(){ const i=editIdx; closeEdit(); delApp(i); }

async function saveApps(silent){
  try{
    const r=await fetch("/apps/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:PW,apps:APPS})});
    const d=await r.json(); if(!r.ok) throw new Error(d.detail||"שגיאה");
  }catch(e){ toast(e.message,1); }
}
document.getElementById("mask").addEventListener("click",e=>{ if(e.target.id==="mask") closeEdit(); });
</script>
</body>
</html>
