<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZOVEX · פאנל ניהול</title>
<style>
  :root { --bg:#0b0b0d; --card:#16161a; --line:#26262c; --txt:#f2f2f4; --dim:#8a8a93; --red:#e50914; --grn:#2ecc71; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial; }
  a { color:inherit; }
  .wrap { max-width:1000px; margin:0 auto; padding:18px 14px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .logo { font-weight:900; font-size:22px; color:var(--red); letter-spacing:1px; }
  .logout { color:var(--dim); font-size:13px; text-decoration:none; }
  /* כניסה */
  .login { min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
  .login h1 { font-size:26px; } .login p { color:var(--dim); max-width:340px; }
  /* כרטיסי סטטיסטיקה */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:24px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .stat .n { font-size:28px; font-weight:800; } .stat .l { color:var(--dim); font-size:13px; margin-top:2px; }
  .stat.warn .n { color:#f1c40f; }
  /* טאבים */
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tab { background:var(--card); border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:8px 16px; font-size:14px; font-weight:700; cursor:pointer; }
  .tab.on { background:var(--red); border-color:var(--red); color:#fff; }
  /* רשימות */
  .row { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row .main { min-width:0; } .row .t { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .s { color:var(--dim); font-size:12px; margin-top:2px; }
  .btns { display:flex; gap:6px; flex-shrink:0; }
  .btn { border:none; border-radius:9px; padding:8px 13px; font-size:13px; font-weight:700; cursor:pointer; color:#fff; }
  .btn.ok { background:var(--grn); } .btn.no { background:#444; }
  .pill { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .pill.approved { background:rgba(46,204,113,.15); color:var(--grn); }
  .pill.pending  { background:rgba(241,196,15,.15); color:#f1c40f; }
  .pill.rejected { background:rgba(229,9,20,.15); color:var(--red); }
  .search { width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; color:var(--txt); padding:12px 15px; font-size:15px; margin-bottom:14px; }
  .empty { color:var(--dim); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login" style="display:none">
    <div class="logo" style="font-size:34px">ZOVEX</div>
    <h1>פאנל ניהול</h1>
    <p>הכניסה לבעלים בלבד. התחבר עם חשבון הטלגרם שלך.</p>
    <div id="tg-login"></div>
  </div>

  <div id="app" style="display:none">
    <header>
      <div class="logo">ZOVEX · ניהול</div>
      <a class="logout" href="{{PANEL_BASE}}/logout">יציאה ⎋</a>
    </header>
    <div id="stats" class="stats"></div>
    <div class="tabs">
      <div class="tab on" data-t="channels">📡 ערוצים</div>
      <div class="tab" data-t="pending">⏳ ממתינים</div>
      <div class="tab" data-t="content">🎬 תוכן</div>
      <div class="tab" data-t="users">👤 משתמשים</div>
      <div class="tab" data-t="requests">🔎 בקשות</div>
    </div>
    <div id="view"></div>
  </div>
</div>

<script>
const BASE = "{{PANEL_BASE}}";
const $ = s => document.querySelector(s);
const api = (p, o) => fetch(BASE + "/api" + p, Object.assign({credentials:"same-origin"}, o||{})).then(r => r.ok ? r.json() : Promise.reject(r.status));
const esc = s => (s==null?"":String(s)).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const when = t => t ? new Date(t*1000).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';

async function boot() {
  try { await api("/me"); showApp(); }
  catch { showLogin(); }
}

function showLogin() {
  $("#login").style.display = "flex";
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://telegram.org/js/telegram-widget.js?22";
  s.setAttribute("data-telegram-login", "{{BOT_USERNAME}}");
  s.setAttribute("data-size", "large");
  s.setAttribute("data-radius", "10");
  s.setAttribute("data-auth-url", BASE + "/auth/telegram");
  s.setAttribute("data-request-access", "write");
  $("#tg-login").appendChild(s);
}

async function showApp() {
  $("#app").style.display = "block";
  const st = await api("/stats");
  $("#stats").innerHTML = [
    ["content","תכנים","🎬",false],
    ["channels_approved","ערוצים מאושרים","📡",false],
    ["channels_pending","ממתינים לאישור","⏳",st.channels_pending>0],
    ["users","משתמשים","👤",false],
    ["requests","בקשות","🔎",false],
  ].map(([k,l,,warn]) => `<div class="stat ${warn?'warn':''}"><div class="n">${st[k]??0}</div><div class="l">${l}</div></div>`).join("");
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on"); load(t.dataset.t);
  });
  load("channels");
}

async function load(tab) {
  const v = $("#view"); v.innerHTML = '<div class="empty">טוען…</div>';
  try {
    if (tab === "channels" || tab === "pending") {
      const data = await api("/channels" + (tab==="pending"?"?status=pending":""));
      if (!data.length) return v.innerHTML = '<div class="empty">אין ערוצים כאן.</div>';
      v.innerHTML = data.map(c => `
        <div class="row" data-id="${c.chat_id}">
          <div class="main">
            <div class="t">${esc(c.title||'ללא שם')} <span class="pill ${c.status}">${({approved:'מאושר',pending:'ממתין',rejected:'נדחה'})[c.status]}</span></div>
            <div class="s">${esc(c.owner_name||'')} · ${c.item_count||0} תכנים · ${when(c.added_at)}</div>
          </div>
          <div class="btns">
            ${c.status!=="approved"?`<button class="btn ok" onclick="act(${c.chat_id},'approve')">אשר</button>`:""}
            ${c.status!=="rejected"?`<button class="btn no" onclick="act(${c.chat_id},'reject')">דחה</button>`:""}
          </div>
        </div>`).join("");
    } else if (tab === "content") {
      v.innerHTML = `<input class="search" placeholder="חפש תוכן…" oninput="contentSearch(this.value)"><div id="clist"></div>`;
      contentSearch("");
    } else if (tab === "users") {
      const u = await api("/users");
      v.innerHTML = u.length ? u.map(x => `<div class="row"><div class="main"><div class="t">${esc(x.name||x.user_id)}</div><div class="s">${x.requests||0} בקשות · נראה ${when(x.last_seen)}</div></div></div>`).join("") : '<div class="empty">אין משתמשים עדיין.</div>';
    } else if (tab === "requests") {
      const r = await api("/requests");
      v.innerHTML = r.length ? r.map(x => `<div class="row"><div class="main"><div class="t">${esc(x.query)} ${x.found?'✅':'❌'}</div><div class="s">${when(x.at)}</div></div></div>`).join("") : '<div class="empty">אין בקשות עדיין.</div>';
    }
  } catch(e){ v.innerHTML = '<div class="empty">שגיאה בטעינה.</div>'; }
}

let _ct;
function contentSearch(q){ clearTimeout(_ct); _ct=setTimeout(async()=>{
  const list = await api("/content?limit=80&q=" + encodeURIComponent(q));
  $("#clist").innerHTML = list.length ? list.map(c=>`<div class="row"><div class="main"><div class="t">${esc(c.name)}</div><div class="s">ערוץ ${c.chat_id} · ${when(c.added_at)}</div></div></div>`).join("") : '<div class="empty">אין תוצאות.</div>';
},250); }

async function act(id, action){
  await api(`/channels/${id}/${action}`, {method:"POST"});
  document.querySelector(`.tab.on`).click();
}

boot();
</script>
</body>
</html>
