services:
  bot:
    build: .
    container_name: zovex-tgbot
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { memory: 256M }
